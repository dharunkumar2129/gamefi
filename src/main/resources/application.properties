# ===============================
# Application
# ===============================
spring.application.name=auth
server.port=${PORT:8080}

# ===============================
# JWT (Environment Variables)
# ===============================
jwt.secret=${JWT_SECRET:supersecretkey12345678901234567890123456789012}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}

# ===============================
# Database (Aiven MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gamefi?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP (VERY IMPORTANT for free tier)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Performance (Cold Start Optimization)
# ===============================
spring.main.lazy-initialization=true

server.tomcat.threads.max=50
server.tomcat.accept-count=100

# ===============================
# Mail (Gmail SMTP)
# ===============================
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# ===============================
# Logging (Reduce noise on Render)
# ===============================
logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=INFO

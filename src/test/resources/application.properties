# ===============================
# Application (Test Settings)
# ===============================
spring.application.name=auth-test

# ===============================
# JWT
# ===============================
jwt.secret=supersecretkey12345678901234567890123456789012
jwt.access-token-expiration=900000

# ===============================
# Database (In-Memory H2 for Testing)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable Lazy Initialization in tests for predictable entity loads
spring.main.lazy-initialization=false

# ===============================
# Mail (Mock settings for Testing)
# ===============================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
